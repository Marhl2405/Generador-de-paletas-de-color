<!-- OPCIÓN 4: Gradiente Geométrico (Triángulo) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D6D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FFE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0d0d0f" stroke="#2a2a35" stroke-width="1"/>
  <!-- Triángulo con gradiente -->
  <polygon points="50,20 80,75 20,75" fill="url(#grad1)" stroke="#e8e0d0" stroke-width="1"/>
  <!-- Triángulo interior -->
  <polygon points="50,35 70,65 30,65" fill="#0d0d0f" opacity="0.3"/>
</svg>
