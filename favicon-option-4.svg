<!-- OPCIÓN 5: Espectro Horizontal Minimalista -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#0d0d0f" stroke="#2a2a35" stroke-width="1"/>
  <!-- Bandas de color espectro -->
  <rect x="20" y="42" width="60" height="3" fill="#FF0000"/>
  <rect x="20" y="45" width="60" height="3" fill="#FF6600"/>
  <rect x="20" y="48" width="60" height="3" fill="#FFFF00"/>
  <rect x="20" y="51" width="60" height="3" fill="#00FF00"/>
  <rect x="20" y="54" width="60" height="3" fill="#00FFFF"/>
  <rect x="20" y="57" width="60" height="3" fill="#0000FF"/>
  <!-- Línea divisoria central -->
  <line x1="50" y1="40" x2="50" y2="60" stroke="#e8e0d0" stroke-width="0.5" opacity="0.5"/>
</svg>
