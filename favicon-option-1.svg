<!-- OPCIÓN 2: Paleta de Pintor Simplificada -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#0d0d0f" stroke="#2a2a35" stroke-width="1"/>
  <!-- Forma de paleta -->
  <ellipse cx="45" cy="50" rx="30" ry="35" fill="none" stroke="#e8e0d0" stroke-width="2"/>
  <!-- Agujero para el dedo -->
  <circle cx="25" cy="60" r="4" fill="#0d0d0f"/>
  <!-- Gotas de color en la paleta -->
  <circle cx="35" cy="35" r="5" fill="#FF4D6D"/>
  <circle cx="50" cy="30" r="5" fill="#00FFE5"/>
  <circle cx="65" cy="35" r="5" fill="#FFD700"/>
  <circle cx="35" cy="50" r="5" fill="#FF6B85"/>
  <circle cx="65" cy="50" r="5" fill="#00FF88"/>
  <circle cx="50" cy="65" r="5" fill="#8800FF"/>
</svg>
