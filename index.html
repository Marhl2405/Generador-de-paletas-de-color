<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHROMATICA — Generador de Paletas</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #141416;
  --panel: #0F0F12;
  --sidebar: #141418;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.12);
  --text: #ECECEC;
  --dim: #8C8C94;
  --dim2: #6E6E76;
  --dim3: #5E5E66;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --display: 'Space Grotesk', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
}

select option { background: #16161B; color: var(--text); }
button { font-family: inherit; }
::selection { background: rgba(255,255,255,0.22); }

.page {
  position: relative; z-index: 1;
  max-width: 1360px; width: 100%; margin: 0 auto;
  padding: 20px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ── APP CARD (studio panel layout) ── */
.app-card {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  flex: 1;
  min-height: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 320px;
  flex: none;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.brand-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.025em;
  line-height: 1;
  text-shadow: 0 0 24px rgba(255,255,255,0.08);
}
.logo-sub {
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--dim);
}

.field-label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--dim2);
  margin-bottom: 8px;
}

.select-wrap { position: relative; }
.type-select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  padding: 13px 37px 13px 15px;
  border-radius: 11px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.type-select:hover, .type-select:focus { border-color: rgba(255,255,255,0.32); }
.select-wrap .chev {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--dim); font-size: 10px;
}

.temp-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.temp-btn {
  width: 100%;
  text-align: left;
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: .01em;
  padding: 11px 15px;
  border: 1px solid var(--border2);
  border-radius: 11px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
}
.temp-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
.temp-btn.active {
  border-color: var(--text);
  color: var(--text);
  background: rgba(255,255,255,0.06);
}
.temp-btn.t-cold.active  { border-color: #5bc8f5; color: #5bc8f5; background: rgba(91,200,245,0.08); }
.temp-btn.t-warm.active  { border-color: #ffaa44; color: #ffaa44; background: rgba(255,170,68,0.08); }
.temp-btn.t-neut.active  { border-color: #b8a0d8; color: #b8a0d8; background: rgba(184,160,216,0.08); }
.temp-btn.t-dark.active  { border-color: #9a9aa2; color: #cfcfd6; background: rgba(255,255,255,0.05); }

.actions { display: flex; flex-direction: column; gap: 9px; }
.btn {
  font-family: inherit;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  transition: all 0.15s;
}
.btn-gen {
  width: 100%;
  background: var(--text);
  color: #0F0F12;
  font-weight: 600;
  font-size: 16px;
  padding: 15px;
}
.btn-gen:hover { background: #ffffff; transform: translateY(-1px); }
.btn-gen:active { transform: translateY(1px); }
.btn-dl {
  width: 100%;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border2);
  font-family: var(--mono);
  font-size: 14px;
  padding: 13px;
}
.btn-dl:hover { border-color: rgba(255,255,255,0.42); }
.btn-dl:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.lang-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lang-lbl { display: none; }
.lang-btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
  padding: 7px 12px;
  border: 1px solid var(--border2);
  border-radius: 999px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
}
.lang-btn:hover { border-color: rgba(255,255,255,0.32); color: var(--text); }
.lang-btn.active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.08); }

.kb-hint {
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--dim3);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: auto;
  letter-spacing: .02em;
}
.kb-hint kbd {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border2);
  color: var(--dim);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
}

/* ── CONTENT ── */
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }

.content-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 24px 0;
}
.pip-type {
  font-family: var(--display);
  font-weight: 700;
  font-size: 21px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.pip-desc {
  font-size: 13px;
  color: var(--dim);
  font-family: var(--sans);
}

/* ── STATS BAR ── */
.palette-info-panel {
  display: flex;
  align-items: flex-start;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.pip-stats { display: flex; align-items: stretch; flex-wrap: wrap; gap: 9px; }
.pip-stat {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 8px 15px;
  border-radius: 11px;
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.pip-stat:hover { background: rgba(255,255,255,0.055); border-color: var(--border2); }
.pip-stat-val {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 600;
  line-height: 1;
  color: var(--text);
  white-space: nowrap;
}
.pip-stat-lbl {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim2);
  cursor: help;
  border-bottom: 1px dashed var(--dim3);
  display: inline-block;
  width: fit-content;
  white-space: nowrap;
}
.pip-swatches-mini { display: flex; gap: 6px; align-items: center; }
.pip-swatch-dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }

.stat-tooltip {
  display: none;
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  background: #1a1a20;
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--sans);
  font-size: 11px;
  line-height: 1.5;
  padding: 10px 12px;
  width: 220px;
  text-align: left;
  z-index: 100;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  pointer-events: none;
}
.pip-stat:hover .stat-tooltip { display: block; }

/* ── SWATCHES ── */
.swatches { display: flex; flex: 1 1 auto; min-height: 230px; }
.swatch {
  position: relative;
  flex: 1;
  height: auto;
  cursor: pointer;
  transition: flex 0.35s cubic-bezier(0.23,1,0.32,1);
  overflow: hidden;
}
.swatch:hover { flex: 1.35; }
.swatch::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
  background: linear-gradient(transparent, rgba(0,0,0,0.4));
  pointer-events: none;
}
.swatch-inner {
  position: relative; z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px;
}
.swatch-top { display: flex; justify-content: space-between; align-items: flex-start; }
.swatch-num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .05em;
  color: #fff;
  opacity: 0.75;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.swatch-lock {
  font-family: var(--mono);
  font-size: 11px;
  background: rgba(0,0,0,0.32);
  border: none;
  border-radius: 6px;
  padding: 4px 7px;
  cursor: pointer;
  line-height: 1;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.swatch:hover .swatch-lock, .swatch.is-locked .swatch-lock { opacity: 1; }
.swatch-bottom { display: flex; flex-direction: column; gap: 4px; }
.swatch-meta {
  opacity: 0;
  transition: opacity 0.2s;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 4px;
}
.swatch:hover .swatch-meta { opacity: 1; }
.swatch-name {
  font-family: var(--display);
  font-weight: 600;
  font-size: 13px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.swatch-rgb, .swatch-hsl {
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(255,255,255,0.8);
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.swatch-hex {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: .02em;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.7);
}
.swatch-flash {
  position: absolute; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.55);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fff;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.swatch.copied .swatch-flash { opacity: 1; }

/* ── PREVIEW ── */
.preview-section, .history-section { padding: 18px 24px; }
.preview-title, .history-title {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--dim2);
  margin-bottom: 8px;
}
.preview-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.preview-card {
  flex: 1;
  min-width: 220px;
  border-radius: 13px;
  padding: 15px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 132px;
  color: #fff;
}
.preview-tag {
  display: inline-block;
  width: fit-content;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  color: #fff;
  margin-bottom: 8px;
}
.preview-card-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 5px;
  line-height: 1.15;
}
.preview-body {
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.45;
  color: rgba(255,255,255,0.92);
}
.preview-chips { display: flex; gap: 8px; margin-top: 12px; }
.preview-chip { width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); }

/* ── HISTORY ── */
.history-grid { display: flex; gap: 9px; flex-wrap: wrap; min-height: 20px; }
.history-item {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  background: transparent;
  padding: 0;
  width: 130px;
  transition: border-color 0.18s;
}
.history-item:hover { border-color: rgba(255,255,255,0.32); }
.history-strip { display: flex; height: 40px; }
.history-strip-swatch { flex: 1; }
.history-meta {
  padding: 5px 8px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-empty {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--dim3);
  letter-spacing: .04em;
  padding: 2px 0;
}
.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.history-head .history-title { margin-bottom: 0; }
.history-clear {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 5px 11px;
  border: 1px solid var(--border2);
  border-radius: 999px;
  background: transparent;
  color: var(--dim2);
  cursor: pointer;
  transition: all 0.15s;
}
.history-clear:hover { border-color: rgba(255,255,255,0.42); color: var(--text); }
.history-clear:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── TOAST ── */
.copy-toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #ffffff;
  color: #0F0F12;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .04em;
  padding: 10px 22px;
  border-radius: 999px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 1000;
}
.copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── FOOTER ── */
.footer {
  margin-top: 18px;
  padding: 16px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}
.footer-text {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .17em;
  color: var(--dim2);
  text-transform: uppercase;
}
.social-links { display: flex; gap: 11px; align-items: center; }
.social-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 8px;
  transition: all 0.2s;
  cursor: pointer;
  text-decoration: none;
}
.social-link:hover { border-color: #fff; background: rgba(255,255,255,0.06); }
.social-link svg { width: 17px; height: 17px; stroke: var(--dim); fill: none; stroke-width: 1.5; }
.social-link:hover svg { stroke: #fff; }

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  .app-card { flex-direction: column; }
  .sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .swatches { flex-direction: column; }
  .swatch { height: 100px; flex: none !important; }
  .swatch:hover { flex: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <div class="app-card">

    <aside class="sidebar">
      <div>
        <div class="brand-name">CHROMATICA</div>
        <div class="logo-sub">// GENERADOR DE PALETAS //</div>
      </div>

      <div class="field">
        <span class="field-label">ARMONÍA</span>
        <div class="select-wrap">
          <select class="type-select" id="paletteType">
            <option value="random">★ ALEATORIO</option>

      <div class="field">

          <button class="temp-btn t-warm"       data-temp="warm"    onclick="setTemp('warm')">🔥 CÁLIDA</button>
          <button class="temp-btn t-cold"       data-temp="cold"    onclick="setTemp('cold')">❄ FRÍA</button>
          <button class="temp-btn t-neut"       data-temp="neutral" onclick="setTemp('neutral')">⚖ NEUTRA</button>
          <button class="temp-btn t-dark"       data-temp="dark2"   onclick="setTemp('dark2')">🌑 OSCURA</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-gen" id="btnGenerate" onclick="generate()">▶ GENERAR</button>
        <button class="btn btn-dl" id="btnDownload" onclick="downloadPNG()" disabled>⬇ PNG</button>
      </div>

      <div class="lang-row">
        <span class="lang-lbl" data-i18n="lang">LANG:</span>
        <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="pt" onclick="setLang('pt')">PT</button>
        <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
        <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日本</button>
      </div>

      <div class="kb-hint">
        <kbd>SPACE</kbd> nueva paleta &nbsp;·&nbsp; <kbd>L</kbd> bloquear color &nbsp;·&nbsp; clic en swatch → copiar HEX
      </div>
    </aside>

    <main class="content">
      <div class="content-head">
        <div class="pip-type" id="currentTypeTag">—</div>

      <div class="palette-info-panel" id="paletteInfoPanel">
        <div class="pip-stats" id="paletteStats"></div>
      </div>

      <div class="swatches" id="swatchesRow"></div>

      <div class="preview-section">
        <div class="preview-title">// VISTA PREVIA //</div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <div class="history-section">
        <div class="history-head">
          <div class="history-title">// HISTORIAL //</div>
          <button class="history-clear" id="btnClearHistory" onclick="clearHistory()" disabled>✕ LIMPIAR</button>
        </div>
        <div class="history-grid" id="historyGrid">
          <div class="history-empty">LAS PALETAS GUARDADAS APARECERÁN AQUÍ...</div>
        </div>
      </div>
    </main>

  </div>

  <div class="footer">
    <div class="footer-text">CHROMATICA · GENERADOR DE PALETAS</div>
    <div class="social-links">
      <a href="https://www.instagram.com/lour.vbb/" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <circle cx="17.5" cy="6.5" r="1.5"/>
        </svg>
      </a>
    </div>
  </div>
</div>

<div class="copy-toast" id="toast">HEX COPIADO ✓</div>

<script>
// ── Color math helpers ──
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s));
  l = Math.max(0, Math.min(100, l));
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255,
      g = parseInt(hex.slice(3,5),16)/255,
      b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h,s,l = (max+min)/2;
  if(max===min){ h=s=0; }
  else {
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return { r, g, b, str: `rgb(${r}, ${g}, ${b})` };
}

function getColorName(hex) {
  const [h, s, l] = hexToHsl(hex);
  if (s < 8) {
    if (l < 10) return 'Negro';
    if (l < 22) return 'Gris muy oscuro';
    if (l < 38) return 'Gris oscuro';
    if (l < 55) return 'Gris medio';
    if (l < 72) return 'Gris claro';
    if (l < 88) return 'Gris muy claro';
    return 'Blanco';
  }
  const lq = l < 20 ? 'Muy oscuro ' : l < 35 ? 'Oscuro ' : l > 79 ? 'Muy claro ' : l > 64 ? 'Claro ' : '';
  const sq = s < 25 ? 'Apagado ' : s > 85 ? 'Vívido ' : '';
  let name;
  if      (h <  8)  name = 'Rojo';
  else if (h < 16)  name = 'Rojo anaranjado';
  else if (h < 27)  name = 'Naranja oscuro';
  else if (h < 38)  name = 'Naranja';
  else if (h < 48)  name = 'Amarillo dorado';
  else if (h < 58)  name = 'Amarillo';
  else if (h < 72)  name = 'Amarillo verdoso';
  else if (h < 90)  name = 'Verde amarillo';
  else if (h < 110) name = 'Verde lima';
  else if (h < 140) name = 'Verde';
  else if (h < 160) name = 'Verde esmeralda';
  else if (h < 175) name = 'Verde azulado';
  else if (h < 190) name = 'Cian';
  else if (h < 205) name = 'Azul celeste';
  else if (h < 220) name = 'Azul cielo';
  else if (h < 240) name = 'Azul';
  else if (h < 255) name = 'Azul índigo';
  else if (h < 270) name = 'Índigo';
  else if (h < 285) name = 'Violeta';
  else if (h < 300) name = 'Púrpura';
  else if (h < 315) name = 'Magenta';
  else if (h < 330) name = 'Rosa fucsia';
  else if (h < 345) name = 'Rosa';
  else              name = 'Rojo rosado';
  // Special overrides
  if (h >= 20 && h < 40 && s < 45 && l < 50) return lq + 'Marrón';
  if (h >= 25 && h < 45 && s > 30 && l < 45) return lq + 'Terracota';
  if (h >= 35 && h < 55 && s > 50 && l > 70) return 'Crema';
  if (h >= 0  && h < 15 && s > 40 && l < 35) return 'Granate';
  return lq + sq + name;
}

function rand(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max+1)); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ── Palette generators with advanced color theory ──
const TYPES = {
  monochromatic: {
    label: 'MONOCROMÁTICA',
    desc: 'Un solo matiz, múltiples luminosidades y saturaciones · armonía por valor',
    gen() {
      const h = pickBaseHue();
      const baseSat = randInt(30,90);
      const strategy = randInt(0, 2);

      let lumValues, satModifiers;

      if (strategy === 0) {
        lumValues = [10, 25, 45, 65, 85];
        satModifiers = [0.5, 0.7, 1, 0.8, 0.4];
      } else if (strategy === 1) {
        lumValues = [15, 35, 55, 70, 88];
        satModifiers = [0.7, 0.9, 0.95, 0.6, 0.3];
      } else {
        lumValues = [20, 40, 60, 75, 90];
        satModifiers = [0.6, 0.85, 1, 0.75, 0.5];
      }

      return lumValues.map((l, i) => ({
        hex: hslToHexT(h, Math.min(100, baseSat * satModifiers[i]), l)
      }));
    }
  },
  analogous: {
    label: 'ANÁLOGA',
    desc: 'Colores adyacentes (20-60°) · armonía natural y cohesiva',
    gen() {
      const h = pickBaseHue();
      const baseSat = randInt(40,90);
      const baseLum = randInt(35,70);
      const spacing = randInt(15, 45);

      const offsets = [-spacing*2, -spacing, 0, spacing, spacing*2];
      return offsets.map(offset => {
        const lumVar = randInt(-12, 15);
        const satVar = randInt(-10, 10);
        return {
          hex: hslToHexT(h + offset, Math.max(20, Math.min(100, baseSat + satVar)), Math.max(10, Math.min(95, baseLum + lumVar)))
        };
      });
    }
  },
  complementary: {
    label: 'COMPLEMENTARIA',
    desc: 'Opuestos exactos (180°) · máximo contraste y dinamismo visual',
    gen() {
      const h = pickBaseHue();
      const h2 = (h + 180) % 360;
      const baseSat = randInt(50,90);
      const baseLum = randInt(40,65);
      const strategy = randInt(0, 1);

      if (strategy === 0) {
        return [
          hslToHexT(h, baseSat, baseLum - 18),
          hslToHexT(h, baseSat + randInt(-10, 10), baseLum),
          hslToHexT(h, baseSat * 0.3, 85),
          hslToHexT(h2, baseSat * 0.95, baseLum),
          hslToHexT(h2, baseSat * 0.6, baseLum - 12)
        ].map(hex => ({ hex }));
      } else {
        return [
          hslToHexT(h, baseSat, baseLum - 15),
          hslToHexT(h, baseSat * 0.5, baseLum + 15),
          hslToHexT(h, baseSat * 0.2, 90),
          hslToHexT(h2, baseSat * 0.85, baseLum - 5),
          hslToHexT(h2, baseSat, baseLum + 10)
        ].map(hex => ({ hex }));
      }
    }
  },
  split: {
    label: 'SPLIT-COMPLEMENTARIA',
    desc: 'Base + dos adyacentes al complementario · equilibrio energético',
    gen() {
      const h = pickBaseHue();
      const offset1 = randInt(140, 160);
      const offset2 = randInt(200, 220);
      const baseSat = randInt(50,85);
      const baseLum = randInt(40,65);

      return [
        hslToHexT(h, baseSat, baseLum),
        hslToHexT(h, baseSat * 0.4, baseLum + 20),
        hslToHexT(h + offset1, baseSat * 0.85, baseLum - randInt(0, 10)),
        hslToHexT(h + offset2, baseSat * 0.8, baseLum - randInt(0, 10)),
        hslToHexT((h + 180) % 360, baseSat * 0.35, 80 + randInt(-5, 5))
      ].map(hex => ({ hex }));
    }
  },
  triadic: {
    label: 'TRÍADA',
    desc: 'Tres colores equidistantes (120°) · vívida pero equilibrada',
    gen() {
      const h = pickBaseHue();
      const baseSat = randInt(55,90);
      const baseLum = randInt(40,65);
      const lumShift = randInt(-15, 15);

      return [
        hslToHexT(h, baseSat, baseLum),
        hslToHexT(h, baseSat * 0.4, baseLum + 22),
        hslToHexT(h + 120, baseSat * 0.95, baseLum + lumShift),
        hslToHexT(h + 240, baseSat * 0.9, baseLum + lumShift),
        hslToHexT((h + 60) % 360, baseSat * 0.5, baseLum - 18)
      ].map(hex => ({ hex }));
    }
  },
  tetradic: {
    label: 'TÉTRADA',
    desc: 'Rectángulo en el círculo (60°/120°/180°) · compleja pero armónica',
    gen() {
      const h = pickBaseHue();
      const rotation = randInt(40, 80);
      const baseSat = randInt(50,80);
      const baseLum = randInt(40,60);

      return [
        hslToHexT(h, baseSat, baseLum),
        hslToHexT(h + rotation, baseSat * 0.8, baseLum - randInt(2, 8)),
        hslToHexT(h + 180, baseSat * 0.85, baseLum),
        hslToHexT(h + 180 + rotation, baseSat * 0.75, baseLum - randInt(2, 8)),
        hslToHexT(h + 90, baseSat * 0.2, 88)
      ].map(hex => ({ hex }));
    }
  },
  square: {
    label: 'CUADRADO EXACTO',
    desc: 'Cuatro colores separados 90° · máxima simetría cromática',
    gen() {
      const h = pickBaseHue();
      const baseSat = randInt(55,90);
      const baseLum = randInt(45,65);
      const lumVar = randInt(-8, 8);

      return [
        hslToHexT(h, baseSat, baseLum + lumVar),
        hslToHexT(h + 90, baseSat, baseLum - lumVar),
        hslToHexT(h + 180, baseSat, baseLum + lumVar),
        hslToHexT(h + 270, baseSat, baseLum - lumVar),
        hslToHexT(h + 45, 10, 92)
      ].map(hex => ({ hex }));
    }
  },
  pastel: {
    label: 'PASTEL',
    desc: 'Baja saturación, alta luminosidad · suave y accesible',
    gen() {
      const h = pickBaseHue();
      const baseHueOffset = randInt(20, 70);
      const offsets = [0, baseHueOffset, baseHueOffset*2, 180 + randInt(-30, 30), 250 + randInt(-30, 30)];

      return offsets.map(offset => ({
        hex: hslToHexT(h + offset, randInt(20, 55), randInt(72, 92))
      }));
    }
  },
  neon: {
    label: 'NEÓN',
    desc: 'Saturación máxima, luminosidad media · eléctrico y vibrante',
    gen() {
      const h = pickBaseHue();
      const spacing = randInt(60, 80);
      const offsets = [0, spacing, spacing*2, spacing*3, spacing*4];

      const colors = offsets.map((offset, i) =>
        hslToHexT(h + offset, 100, 52 + randInt(-5, 8))
      );
      colors[Math.floor(colors.length/2)] = hslToHexT((h + offsets[Math.floor(offsets.length/2)]) % 360, 15, 8);
      return colors.map(hex => ({ hex }));
    }
  },
  earth: {
    label: 'TIERRAS',
    desc: 'Tonos cálidos desaturados · orgánico y natural',
    gen() {
      const baseH = randInt(0, 50);
      const baseHues = [
        baseH + randInt(-10, 10),
        baseH + randInt(15, 35),
        baseH + randInt(35, 60),
        baseH + randInt(-15, 5),
        baseH + randInt(20, 50)
      ];

      return baseHues.map((h, i) => ({
        hex: hslToHexT(h, randInt(30, 70), randInt(25 + i*8, 50 + i*5))
      }));
    }
  },
  dark: {
    label: 'OSCURA / SOMBRÍA',
    desc: 'Tonos profundos con acento · dramática y sofisticada',
    gen() {
      const h = pickBaseHue();
      const accentH = (h + randInt(160, 200)) % 360;
      const baseSat = randInt(35,70);

      return [
        hslToHexT(h, baseSat * 0.6, randInt(5, 15)),
        hslToHexT(h, baseSat * 0.5, randInt(15, 25)),
        hslToHexT(h, baseSat, randInt(28, 38)),
        hslToHexT(accentH, randInt(70, 100), randInt(55, 70)),
        hslToHexT(h, 5, randInt(80, 90))
      ].map(hex => ({ hex }));
    }
  },
  vintage: {
    label: 'VINTAGE',
    desc: 'Saturación media, luminosidad variable · nostálgica y armónica',
    gen() {
      const h = pickBaseHue();
      const baseSat = randInt(25,60);
      const baseLum = randInt(45,75);
      const hueSpacing = randInt(35, 95);

      return [0, 1, 2, 3, 4].map(i => ({
        hex: hslToHexT(h + hueSpacing * i, baseSat + randInt(-15, 15), baseLum + randInt(-18, 18))
      }));
    }
  },
  random: {
    label: 'ALEATORIA',
    desc: '¡Sorpresa total! Combinación aleatoria de armonías',
    gen() {
      const keys = Object.keys(TYPES).filter(k => k !== 'random');
      const chosen = pick(keys);
      const result = TYPES[chosen].gen();
      currentRandomSubtype = chosen;
      return result;
    }
  }
};

let currentPalette = []; // [{hex, locked}]
let history = [];
let currentRandomSubtype = '';
let lockedIndex = -1;

function showToast(msg, ms = 1800) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
}

function generate() {
  const type = document.getElementById('paletteType').value;
  const def = TYPES[type];
  const newColors = def.gen();

  // Preserve locked swatches
  if (currentPalette.length === newColors.length) {
    newColors.forEach((c, i) => {
      if (currentPalette[i]?.locked) newColors[i] = { ...currentPalette[i] };
    });
  }

  currentPalette = newColors.map(c => ({ hex: c.hex, locked: c.locked || false }));
  ensureDistinctPalette(currentPalette);

  const tag = type === 'random'
    ? `${L().types.random?.label || 'RANDOM'} · ${L().types[currentRandomSubtype]?.label || currentRandomSubtype}`
    : (L().types[type]?.label || def.label);

  document.getElementById('currentTypeTag').textContent = tag;
  document.getElementById('currentDesc').textContent = L().types[type]?.desc || def.desc;

  // Build stats panel
  const hslVals = currentPalette.map(c => hexToHsl(c.hex));
  const avgHue = Math.round(hslVals.reduce((a,v) => a+v[0], 0) / hslVals.length);
  const avgSat = Math.round(hslVals.reduce((a,v) => a+v[1], 0) / hslVals.length);
  const avgLum = Math.round(hslVals.reduce((a,v) => a+v[2], 0) / hslVals.length);
  const warmCool = L().warmCoolFn(avgHue);
  const mood = L().moodFn(avgLum, avgSat);

  const miniDots = currentPalette.map(c =>
    `<div class="pip-swatch-dot" style="background:${c.hex}" title="${getColorName(c.hex)}"></div>`
  ).join('');

  const l = L();
  document.getElementById('paletteStats').innerHTML = `
    <div class="pip-stat">
      <span class="pip-stat-val">${currentPalette.length}</span>
      <span class="pip-stat-lbl">${l.statColors}</span>
      <div class="stat-tooltip">${l.ttColors}</div>
    </div>
    <div class="pip-stat">
      <span class="pip-stat-val">${avgHue}°</span>
      <span class="pip-stat-lbl">${l.statHue}</span>
      <div class="stat-tooltip">${l.ttHue}</div>
    </div>
    <div class="pip-stat">
      <span class="pip-stat-val">${avgSat}%</span>
      <span class="pip-stat-lbl">${l.statSat}</span>
      <div class="stat-tooltip">${l.ttSat}</div>
    </div>
    <div class="pip-stat">
      <span class="pip-stat-val">${avgLum}%</span>
      <span class="pip-stat-lbl">${l.statLum}</span>
      <div class="stat-tooltip">${l.ttLum}</div>
    </div>
    <div class="pip-stat">
      <span class="pip-stat-val" style="font-size:0.82rem">${warmCool}</span>
      <span class="pip-stat-lbl">${l.statTemp}</span>
      <div class="stat-tooltip">${l.ttTemp}</div>
    </div>
    <div class="pip-stat">
      <span class="pip-stat-val" style="font-size:0.82rem">${mood}</span>
      <span class="pip-stat-lbl">${l.statMood}</span>
      <div class="stat-tooltip">${l.ttMood}</div>
    </div>
    <div class="pip-stat">
      <div class="pip-swatches-mini">${miniDots}</div>
      <span class="pip-stat-lbl">${l.statSample}</span>
    </div>
  `;

  renderSwatches();
  renderPreview();
  saveToHistory(tag);
  document.getElementById('btnDownload').disabled = false;

  // Store stats for PNG export
  window._paletteStats = { tag, avgHue, avgSat, avgLum, warmCool, mood };
}

function renderSwatches() {
  const row = document.getElementById('swatchesRow');
  row.innerHTML = currentPalette.map((c, i) => {
    const rgb = hexToRgb(c.hex);
    const colorName = getColorName(c.hex);
    const [h, s, lv] = hexToHsl(c.hex);
    return `
    <div class="swatch${c.locked ? ' is-locked' : ''}"
         style="background:${c.hex}"
         onclick="copySwatch('${c.hex}', this)"
         ondblclick="toggleLock(${i})">
      <div class="swatch-inner">
        <div class="swatch-top">
          <span class="swatch-num">${String(i+1).padStart(2,'0')}</span>
          <button class="swatch-lock" onclick="event.stopPropagation(); toggleLock(${i})">${c.locked ? '🔒' : '🔓'}</button>
        </div>
        <div class="swatch-bottom">
          <div class="swatch-meta">
            <span class="swatch-name">${colorName}</span>
            <span class="swatch-rgb">${rgb.str}</span>
            <span class="swatch-hsl">hsl(${h}°, ${s}%, ${lv}%)</span>
          </div>
          <div class="swatch-hex">${c.hex.toUpperCase()}</div>
        </div>
      </div>
      <div class="swatch-flash">${L().toastCopied || 'Copiado'}</div>
    </div>`;
  }).join('');
}

function toggleLock(i) {
  currentPalette[i].locked = !currentPalette[i].locked;
  renderSwatches();
}

function copySwatch(hex, el) {
  const hexToCopy = hex.slice(1);
  navigator.clipboard.writeText(hexToCopy).catch(() => {});
  const toast = document.getElementById('toast');
  toast.textContent = hexToCopy.toUpperCase() + ' — ' + (L().toastCopied || 'COPIED ✓');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
  if (el) {
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 900);
  }
}

function saveToHistory(tag) {
  history.unshift({ colors: currentPalette.map(c => c.hex), tag });
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('historyGrid');
  const clearBtn = document.getElementById('btnClearHistory');
  if (clearBtn) clearBtn.disabled = history.length === 0;
  if (!history.length) {
    grid.innerHTML = `<div class="history-empty">${L().historyEmpty}</div>`;
    return;
  }
  grid.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      <div class="history-strip">
        ${h.colors.map(c => `<div class="history-strip-swatch" style="background:${c}"></div>`).join('')}
      </div>
      <div class="history-meta">
        <span>${h.tag.split(' · ')[0]}</span>
        <span style="color:var(--text)">→</span>
      </div>
    </div>
  `).join('');
}

function clearHistory() {
  if (!history.length) return;
  history = [];
  renderHistory();
  showToast(L().toastHistoryCleared || 'Historial limpiado');
}

function loadHistory(i) {
  const h = history[i];
  currentPalette = h.colors.map(hex => ({ hex, locked: false }));
  document.getElementById('currentTypeTag').textContent = h.tag;
  renderSwatches();
  renderPreview();
}

// ── Download PNG ──
function downloadPNG() {
  if (!currentPalette.length) return;
  const stats = window._paletteStats || {};

  const cols = currentPalette.length <= 3 ? currentPalette.length : Math.ceil(currentPalette.length / 2);
  const rows = Math.ceil(currentPalette.length / cols);

  const PAD       = 40;   // outer margin
  const GAP       = 10;   // gap between swatches
  const CELL_W    = 240;  // swatch width
  const SWATCH_H  = 280;  // colored rectangle height
  const INFO_H    = 90;   // text block below each swatch
  const CELL_H    = SWATCH_H + INFO_H;
  const HEADER_H  = 210;  // top stats area
  const FOOTER_H  = 40;

  const W = PAD * 2 + cols * CELL_W + (cols - 1) * GAP;
  const H = HEADER_H + rows * CELL_H + (rows - 1) * GAP + PAD + FOOTER_H;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');

  // ── Background ──
  cx.fillStyle = '#141416';
  cx.fillRect(0, 0, W, H);

  // ── HEADER ──
  const accentHex = currentPalette[Math.min(3, currentPalette.length - 1)].hex;
  const accentRgb = hexToRgb(accentHex);

  // Logo
  cx.textAlign = 'left';
  cx.font = 'bold 44px "Space Grotesk", "JetBrains Mono", sans-serif';
  cx.fillStyle = '#ECECEC';
  cx.fillText('CHROMATICA', PAD, 56);

  // Accent underline
  cx.strokeStyle = accentHex;
  cx.lineWidth = 2;
  cx.shadowColor = `rgba(${accentRgb.r},${accentRgb.g},${accentRgb.b},0.9)`;
  cx.shadowBlur = 10;
  cx.beginPath(); cx.moveTo(PAD, 64); cx.lineTo(PAD + 360, 64); cx.stroke();
  cx.shadowBlur = 0;

  // Palette type
  cx.font = '18px "JetBrains Mono", monospace';
  cx.fillStyle = accentHex;
  cx.fillText((stats.tag || 'PALETA').toUpperCase(), PAD, 92);

  // Divider
  cx.strokeStyle = 'rgba(255,255,255,0.16)';
  cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(PAD, 108); cx.lineTo(W - PAD, 108); cx.stroke();

  // Stats row
  const statItems = [
    ['MATIZ',        `${stats.avgHue || 0}°`],
    ['SATURACIÓN',   `${stats.avgSat || 0}%`],
    ['LUMINOSIDAD',  `${stats.avgLum || 0}%`],
    ['TEMPERATURA',  (stats.warmCool || '—').replace(/[🔥❄⚖🌑]/gu, '').trim()],
    ['MOOD',         stats.mood || '—'],
  ];

  const statAreaW = W - PAD * 2;
  const statGap   = statAreaW / statItems.length;
  const statY     = 130;

  statItems.forEach(([lbl, val], i) => {
    const sx = PAD + i * statGap;
    cx.textAlign = 'left';
    cx.font = '10px "JetBrains Mono", monospace';
    cx.fillStyle = '#8C8C94';
    cx.fillText(lbl, sx, statY);
    cx.font = 'bold 20px "JetBrains Mono", monospace';
    cx.fillStyle = '#ECECEC';
    cx.fillText(val, sx, statY + 28);
  });

  // Second divider
  cx.strokeStyle = 'rgba(255,255,255,0.16)';
  cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(PAD, HEADER_H - 14); cx.lineTo(W - PAD, HEADER_H - 14); cx.stroke();

  // ── Swatches grid ──
  currentPalette.forEach((c, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x   = PAD + col * (CELL_W + GAP);
    const y   = HEADER_H + row * (CELL_H + GAP);

    const rgb = hexToRgb(c.hex);
    const [h, s, l] = hexToHsl(c.hex);

    // ── Colored rectangle ──
    cx.fillStyle = c.hex;
    cx.fillRect(x, y, CELL_W, SWATCH_H);

    // ── Info block (dark bg) ──
    cx.fillStyle = '#0F0F12';
    cx.fillRect(x, y + SWATCH_H, CELL_W, INFO_H);

    // Fine border around whole cell
    cx.strokeStyle = 'rgba(255,255,255,0.08)';
    cx.lineWidth = 1;
    cx.strokeRect(x, y, CELL_W, SWATCH_H + INFO_H);

    // ── Text: HEX ──
    const tx = x + CELL_W / 2;
    cx.textAlign = 'center';

    cx.font = 'bold 16px "JetBrains Mono", monospace';
    cx.fillStyle = '#ECECEC';
    cx.fillText(c.hex.toUpperCase(), tx, y + SWATCH_H + 24);

    // ── Text: RGB ──
    cx.font = '12px "JetBrains Mono", monospace';
    cx.fillStyle = 'rgba(255,255,255,0.65)';
    cx.fillText(`RGB  ${rgb.r}, ${rgb.g}, ${rgb.b}`, tx, y + SWATCH_H + 46);

    // ── Text: HSL ──
    cx.fillStyle = 'rgba(255,255,255,0.45)';
    cx.fillText(`HSL  ${h}°  ${s}%  ${l}%`, tx, y + SWATCH_H + 66);
  });

  // ── Footer ──
  cx.textAlign = 'center';
  cx.font = '10px "JetBrains Mono", monospace';
  cx.fillStyle = '#5E5E66';
  cx.fillText('CHROMATICA · GENERADOR DE PALETAS', W / 2, H - 14);

  // ── Download ──
  const link = document.createElement('a');
  link.download = `chromatica_${(stats.tag || 'paleta').replace(/[^a-zA-Z0-9]/g, '_').toLowerCase()}.png`;
  link.href = cv.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  const t = document.getElementById('toast');
  t.textContent = 'PNG DESCARGADO ✓';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Temperature filter ──
let currentTemp = 'any';

// Hue ranges per temperature — used only to pick the palette's base hue,
// never to bend individual harmony offsets (that would destroy the harmony).
const TEMP_RANGES = {
  warm:    [[0,60],[300,360]],   // reds, oranges, yellows, hot pinks
  cold:    [[160,280]],          // cyans, blues, purples
  neutral: [[60,160],[280,300]], // yellows-green, soft purples
};

function setTemp(t) {
  currentTemp = t;
  document.querySelectorAll('.temp-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.temp === t);
  });
}

// Picks ONE base hue for the whole palette, biased toward the selected
// temperature. Harmony generators then derive every other color from this
// single hue (h+120, h+180…), so the chosen harmony's spacing stays intact.
function pickBaseHue() {
  if (currentTemp === 'any' || currentTemp === 'dark2') return randInt(0, 359);
  const ranges = TEMP_RANGES[currentTemp];
  const r = pick(ranges);
  return Math.floor(rand(r[0], r[1]));
}

// Nudges saturation/lightness to reinforce the chosen temperature's mood
// without flattening the contrast a harmony generator already built in
// (that flattening is what used to make swatches collapse into near-duplicates).
function applyTempToHsl(h, s, l) {
  const nh = ((h % 360) + 360) % 360;
  if (currentTemp === 'dark2') {
    return [nh, Math.min(100, s * 0.92), Math.max(4, l * 0.45)];
  }
  if (currentTemp === 'warm') {
    return [nh, Math.min(100, s + 10), l];
  }
  if (currentTemp === 'cold') {
    return [nh, Math.min(100, s + 6), l];
  }
  if (currentTemp === 'neutral') {
    return [nh, Math.max(0, s - 18), l];
  }
  return [nh, s, l];
}

// Patch hslToHex to apply temperature
function hslToHexT(h, s, l) {
  const [th, ts, tl] = applyTempToHsl(h, s, l);
  return hslToHex(th, ts, tl);
}

// ── Ensure no two colors in the same palette read as duplicates ──
function colorDistance(hexA, hexB) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
  return Math.sqrt(dr*dr + dg*dg + db*db);
}

function ensureDistinctPalette(palette) {
  const MIN_DIST = 26;
  for (let i = 1; i < palette.length; i++) {
    if (palette[i].locked) continue;
    let guard = 0;
    while (guard < 24 && palette.some((c, j) => j !== i && colorDistance(palette[i].hex, c.hex) < MIN_DIST)) {
      const [h, s, l] = hexToHsl(palette[i].hex);
      const dir = l > 50 ? -1 : 1;
      const newL = Math.max(4, Math.min(96, l + dir * (8 + guard * 2)));
      palette[i].hex = guard > 6
        ? hslToHex((h + 20 + guard * 8) % 360, s, newL)
        : hslToHex(h, s, newL);
      guard++;
    }
  }
  return palette;
}

function L() { return I18N[currentLang] || I18N.es; }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  applyLangUI();
  if (currentPalette.length) generate();
}

function applyLangUI() {
  const l = L();
  document.querySelector('.logo-sub').textContent = l.subtitle;
  document.getElementById('btnGenerate').textContent = l.generate;
  document.getElementById('btnDownload').textContent = l.download;
  document.querySelector('.temp-label').textContent = l.temp;
  document.querySelector('.kb-hint').innerHTML = l.kbHint;
  document.querySelector('.preview-title').textContent = l.previewTitle;
  document.querySelector('.history-title').textContent = l.historyTitle;
  document.getElementById('btnClearHistory').textContent = l.clearHistory;
  renderHistory();
  const tempBtns = document.querySelectorAll('.temp-btn');
  [l.tempAny,l.tempWarm,l.tempCold,l.tempNeut,l.tempDark].forEach((txt,i)=>{ if(tempBtns[i]) tempBtns[i].textContent=txt; });
  const sel = document.getElementById('paletteType');
  const keys = ['random','monochromatic','analogous','complementary','split','triadic','tetradic','square','pastel','neon','earth','dark','vintage'];
  Array.from(sel.options).forEach((opt,i) => {
    const k = keys[i];
    opt.textContent = k==='random' ? l.selectRandom : (l.types[k]?.label || opt.textContent);
  });
  if (!currentPalette.length) document.getElementById('currentDesc').textContent = l.initialDesc;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); generate(); }
});

// Init
applyLangUI();
generate();
</script>
