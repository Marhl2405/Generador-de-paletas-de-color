<!-- OPCIÓN 6: Cuadrícula de Colores -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="#0d0d0f" stroke="#2a2a35" stroke-width="1"/>
  <!-- Grid 3x3 de colores -->
  <rect x="25" y="25" width="13" height="13" fill="#FF0000"/>
  <rect x="40" y="25" width="13" height="13" fill="#00FF00"/>
  <rect x="55" y="25" width="13" height="13" fill="#0000FF"/>
  
  <rect x="25" y="40" width="13" height="13" fill="#FFFF00"/>
  <rect x="40" y="40" width="13" height="13" fill="#FF4D6D"/>
  <rect x="55" y="40" width="13" height="13" fill="#00FFE5"/>
  
  <rect x="25" y="55" width="13" height="13" fill="#FF00FF"/>
  <rect x="40" y="55" width="13" height="13" fill="#00FFFF"/>
  <rect x="55" y="55" width="13" height="13" fill="#FFA500"/>
  
  <!-- Líneas divisoras -->
  <line x1="38" y1="25" x2="38" y2="68" stroke="#2a2a35" stroke-width="0.5"/>
  <line x1="53" y1="25" x2="53" y2="68" stroke="#2a2a35" stroke-width="0.5"/>
  <line x1="25" y1="38" x2="68" y2="38" stroke="#2a2a35" stroke-width="0.5"/>
  <line x1="25" y1="53" x2="68" y2="53" stroke="#2a2a35" stroke-width="0.5"/>
</svg>
