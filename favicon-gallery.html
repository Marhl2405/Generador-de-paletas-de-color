<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHROMATICA — Selecciona tu Favicon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0f;
            color: #e8e0d0;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            padding: 40px 20px;
            cursor: crosshair;
        }

        /* CRT scanlines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.025) 2px,
                rgba(255, 255, 255, 0.025) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 30px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 4px;
            color: #e8e0d0;
            text-shadow: 0 0 30px rgba(255, 77, 109, 0.4);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #6a6478;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .favicon-card {
            background: linear-gradient(135deg, #141418 0%, #1a1820 100%);
            border: 1px solid #2a2a35;
            padding: 30px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .favicon-card:hover {
            border-color: #ff4d6d;
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.4), inset 0 0 20px rgba(255, 77, 109, 0.05);
        }

        .favicon-preview {
            width: 120px;
            height: 120px;
            background: #0d0d0f;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .favicon-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .favicon-card h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 12px;
            color: #ff4d6d;
            text-shadow: 0 0 16px rgba(255, 77, 109, 0.3);
        }

        .favicon-card p {
            font-size: 0.95rem;
            color: #a09098;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .favicon-card button {
            background: #ff4d6d;
            color: #0d0d0f;
            border: none;
            padding: 10px 20px;
            font-family: 'VT323', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
        }

        .favicon-card button:hover {
            background: #ff6b85;
            box-shadow: 0 0 35px rgba(255, 77, 109, 0.6);
            transform: translateY(-2px);
        }

        .favicon-card button:active {
            transform: translateY(0);
        }

        .favicon-card.selected {
            border-color: #00ffe5;
            box-shadow: 0 0 25px rgba(0, 255, 229, 0.5), inset 0 0 20px rgba(0, 255, 229, 0.1);
        }

        .favicon-card.selected::before {
            content: '✓ SELECCIONADO';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00ffe5;
            color: #0d0d0f;
            padding: 4px 10px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .info-panel {
            background: #141418;
            border: 1px solid #2a2a35;
            padding: 25px;
            margin-top: 40px;
            text-align: center;
            border-radius: 0;
        }

        .info-panel h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: #00ffe5;
        }

        .info-panel p {
            font-size: 0.95rem;
            color: #a09098;
            margin-bottom: 20px;
        }

        .preview-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .browser-tab {
            background: #1a1820;
            border: 1px solid #2a2a35;
            padding: 8px 12px;
            border-radius: 4px 4px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .browser-tab img {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .favicon-preview {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CHROMATICA</h1>
        <p class="subtitle">// SELECCIONA TU FAVICON //</p>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="info-panel">
        <h3>VISTA PREVIA EN PESTAÑA</h3>
        <p>Así se vería el favicon seleccionado en la pestaña de tu navegador:</p>
        <div class="preview-row">
            <div class="browser-tab">
                <img id="tabPreview" src="favicon-option-1.svg" alt="favicon">
                <span>CHROMATICA</span>
            </div>
        </div>
    </div>
</div>

<script>
    const options = [
        {
            id: 1,
            name: 'Círculo Cromático',
            description: 'Rueda de colores clásica con 12 segmentos. Representa la teoría cromática tradicional.',
            file: 'favicon-option-1.svg'
        },
        {
            id: 2,
            name: 'Paleta de Pintor',
            description: 'Forma tradicional de paleta con gotas de color. Evoca la creatividad artística clásica.',
            file: 'favicon-option-2.svg'
        },
        {
            id: 3,
            name: 'Pincelada Dinámica',
            description: 'Trazo de pincel fluido y energético. Representa movimiento y creatividad moderna.',
            file: 'favicon-option-3.svg'
        },
        {
            id: 4,
            name: 'Gradiente Geométrico',
            description: 'Triángulo con gradiente suave. Mezcla arte digital con diseño contemporáneo.',
            file: 'favicon-option-4.svg'
        },
        {
            id: 5,
            name: 'Espectro Minimalista',
            description: 'Bandas de color horizontales. Simple, limpio y directamente relacionado con el espectro.',
            file: 'favicon-option-5.svg'
        }
    ];

    let selectedId = 1;

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = options.map(option => `
            <div class="favicon-card ${option.id === selectedId ? 'selected' : ''}" onclick="selectFavicon(${option.id})">
                <div class="favicon-preview">
                    <img src="${option.file}" alt="${option.name}">
                </div>
                <h3>${option.name}</h3>
                <p>${option.description}</p>
                <button onclick="event.stopPropagation(); selectFavicon(${option.id})">
                    ${option.id === selectedId ? '✓ SELECCIONADO' : 'SELECCIONAR'}
                </button>
            </div>
        `).join('');
    }

    function selectFavicon(id) {
        selectedId = id;
        const option = options.find(o => o.id === id);
        document.getElementById('tabPreview').src = option.file;
        renderGallery();

        // Efecto visual
        const cards = document.querySelectorAll('.favicon-card');
        cards.forEach((card, idx) => {
            if (idx + 1 === id) {
                card.style.animation = 'pulse 0.5s ease';
            }
        });
    }

    // Inicializar
    renderGallery();

    // Animación de pulse
    const style = document.createElement('style');
    style.textContent = `
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
